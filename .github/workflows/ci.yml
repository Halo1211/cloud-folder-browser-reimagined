name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore CloudFolderBrowser.sln
      - name: Build
        run: dotnet build CloudFolderBrowser.sln -c Release --no-restore -p:TreatWarningsAsErrors=true
      - name: Test
        run: dotnet test CloudFolderBrowser.Tests/CloudFolderBrowser.Tests.csproj -c Release --no-build
