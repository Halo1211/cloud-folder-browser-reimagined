name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Build release package
        shell: pwsh
        run: ./tools/Build-Release.ps1 -ExpectedVersion ($env:GITHUB_REF_NAME -replace '^v', '')
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3.0.3
        with:
          fail_on_unmatched_files: true
          make_latest: true
          body_path: release/RELEASE_NOTES.md
          files: |
            release/CloudFolderBrowser.exe
            release/CloudFolderBrowser.dll.config
            release/CloudFolderBrowser-Reimagined-v*-win-x64.zip
            release/SHA256SUMS.txt
